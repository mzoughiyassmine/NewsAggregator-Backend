spring.application.name=News_Agg_backend

spring.mongodb.uri=mongodb://localhost:27017/news_aggregator
server.port=8088

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Compte administrateur initial
app.admin.name=Administrateur
app.admin.email=admin@newsaggregator.com
app.admin.password=${ADMIN_PASSWORD}


# Collecte automatique des articles
app.collector.interval-ms=3600000
app.collector.initial-delay-ms=10000

# Crée les index déclarés avec @Indexed (unicité de Article.link et de Category.nameKey)
spring.data.mongodb.auto-index-creation=true


# Envoi d'e-mails (Gmail SMTP) : identifiants fournis par variables d'environnement
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME}